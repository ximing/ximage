<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ximage</title>
    <script>
      (function () {
        if (location.protocol === "file:") return;
        var saved = null;
        try {
          saved = localStorage.getItem("ximage-theme");
        } catch (e) {}
        if (saved !== "light" && saved !== "dark") {
          saved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = saved;
      })();
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("ximage-locale");
        } catch (e) {}
        if (saved !== "en" && saved !== "zh") saved = "zh";
        document.documentElement.lang = saved;
      })();
    </script>
    <script>
      (function () {
        if (location.protocol !== "file:") return;
        function show() {
          var root = document.getElementById("root");
          if (!root) return;
          root.replaceChildren();
          var box = document.createElement("main");
          box.id = "file-protocol-notice";
          box.setAttribute("role", "alert");
          var lang = document.documentElement.lang === "en" ? "en" : "zh";
          var copyText = {
            zh: {
              title: "请通过 HTTP 打开这个文件夹",
              body: "Ximage 不能从 file:// 地址运行，因为浏览器会拦截那里的模块脚本。请先构建站点，再用 HTTP 打开 dist 文件夹。在项目目录里执行：pnpm run build，然后 pnpm dlx serve dist。GitHub Pages 项目站点也是同样的方式。",
            },
            en: {
              title: "Serve this folder over HTTP",
              body: "Ximage cannot run from a file:// address because browsers block module scripts there. Build the site, then serve the dist folder over HTTP. From the project that is: pnpm run build, then pnpm dlx serve dist. A GitHub Pages project site works the same way.",
            },
          };
          var title = document.createElement("h1");
          title.textContent = copyText[lang].title;
          var copy = document.createElement("p");
          copy.textContent = copyText[lang].body;
          box.appendChild(title);
          box.appendChild(copy);
          root.appendChild(box);
        }
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", show);
        else show();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
